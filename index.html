<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚜ Le Jeu des Couronnes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #08080f;
    --surf:    #0f0f1c;
    --card:    #15152a;
    --bord:    #252545;
    --gold:    #c9a84c;
    --goldL:   #f0d080;
    --royal:   #8b5cf6;
    --classic: #2563eb;
    --nem:     #dc2626;
    --text:    #e8e0d5;
    --muted:   #7870a0;
    --green:   #22c55e;
    --red:     #ef4444;
  }
  body { background: var(--bg); color: var(--text); font-family: Georgia, serif; min-height: 100vh; }
  h1,h2,h3 { font-family: Georgia, serif; }
  #app { max-width: 900px; margin: 0 auto; padding: 0 1rem 3rem; }
  @media(min-width: 880px){
    #app.in-game { max-width: 1180px; }
  }
  header { text-align: center; padding: 1.5rem 1rem 1rem; border-bottom: 1px solid var(--bord); margin-bottom: 1.25rem; }
  header h1 { font-size: 2rem; font-weight: 700; color: var(--goldL); letter-spacing: .06em; }
  header p  { color: var(--muted); font-size: .85rem; margin-top: .25rem; font-family: sans-serif; }
  .box { background: var(--surf); border: 1px solid var(--bord); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .box.accent { border-color: var(--gold); }
  button { cursor: pointer; font-family: sans-serif; font-size: .88rem; font-weight: 600;
           border-radius: 6px; padding: .55rem 1.25rem; transition: opacity .15s, transform .1s; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  .btn-primary   { background: var(--gold); color: #1a1000; border: none; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--bord); }
  .btn-danger    { background: #7f1d1d; color: #fca5a5; border: none; }
  .btn-warn      { background: #78350f; color: #fcd34d; border: none; }
  input[type=text], input[type=number] {
    background: var(--card); border: 1px solid var(--bord); border-radius: 6px;
    color: var(--text); padding: .5rem .8rem; font-size: 1rem; font-family: sans-serif; width: 100%;
  }
  input:focus { outline: none; border-color: var(--gold); }
  .pill-royal   { display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-family:sans-serif;font-weight:700;background:#1e1240;color:#a78bfa;border:1px solid #4c1d95; }
  .pill-classic { display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-family:sans-serif;font-weight:700;background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8; }
  .pill-nem     { display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-family:sans-serif;font-weight:700;background:#3b0a0a;color:#f87171;border:1px solid #7f1d1d; }
  .pill-elim    { display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-family:sans-serif;font-weight:700;background:#3b0a0a;color:#f87171;border:1px solid #7f1d1d;text-decoration:line-through; }
  .tag-active   { display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-family:sans-serif;background:#14532d;color:var(--green);border:1px solid #166534; }
  .tag-out      { display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-family:sans-serif;background:#1c1c30;color:var(--muted);border:1px solid var(--bord); }
  .crd { border-radius: 9px; border: 2px solid var(--bord); background: var(--card);
         display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
         flex-shrink: 0; user-select: none; transition: box-shadow .2s, border-color .2s;
         padding: .4rem .5rem; min-width: 0; }
  .crd.sm  { padding: .3rem .35rem; }
  .crd.lg  { padding: .45rem .6rem; }
  .crd.hidden { background: #0a0a16; }
  .crd.glow   { border-color: var(--gold); box-shadow: 0 0 14px #c9a84c55; }
  .crd.burned { opacity: .45; border-style: dashed; }
  .crd .sym   { font-size: 1.8rem; color: var(--goldL); font-weight: bold; }
  .crd .cname { color: var(--muted); text-align: center; padding: 0 5px; line-height: 1.25; font-size: .65rem; margin-top: 4px; font-family: sans-serif; }
  .crd.sm .sym   { font-size: 1.2rem; }
  .crd.sm .cname { font-size: .52rem; }
  .crd .hidden-sym { font-size: 2rem; color: var(--bord); }
  .crd.sm .hidden-sym { font-size: 1.4rem; }
  .crd-empty { border-radius: 7px; border: 1px dashed var(--bord); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .crd-empty.sm { width:52px; height:62px; }
  .crd-empty.lg { width:64px; height:76px; }
  .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .65rem; margin-bottom: 1rem; }

  /* ── Layout : col1 (40%, joueurs en haut / carte en bas) | col2 (combinaisons) | journal pleine largeur ── */
  .game-layout { display: flex; flex-direction: column; gap: 1rem; }
  .game-row    { display: flex; flex-direction: column; gap: 1rem; }
  .col1        { min-width: 0; }
  .col2        { min-width: 0; }
  .col1-inner  { display: flex; flex-direction: column; gap: .75rem; }
  .col1-players { display: grid; grid-template-columns: 1fr; gap: .6rem; }
  .col1-auction { min-width: 0; }
  @media(min-width: 880px){
    .game-row { flex-direction: row; align-items: stretch; }
    .col1 { flex: 0 0 40%; max-width: 40%; }
    .col2 { flex: 1 1 60%; max-width: 60%; }
  }
  .col1-players { display: flex; flex-direction: column; gap: .6rem; }
  .combos-box { height: 100%; }
  .combos-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  @media(max-width: 600px){ .combos-grid-3 { grid-template-columns: repeat(2, 1fr); } }
  .player-box { background: var(--surf); border: 1px solid var(--bord); border-radius: 12px; padding: .9rem; transition: border-color .2s; }
  .player-box.mine   { border-color: #4c1d9588; }
  .player-box.active { border-color: var(--gold); }
  .player-hand { display: flex; gap: 5px; flex-wrap: wrap; margin-top: .4rem; }
  #log { max-height: 150px; overflow-y: auto; padding: .4rem 1rem; }
  .log-line { font-family: sans-serif; font-size: .78rem; padding: 2px 0; color: var(--text); opacity: .85; }
  .log-sep  { font-family: sans-serif; font-size: .78rem; padding: 2px 0; color: var(--gold); }
  .log-burn { font-family: sans-serif; font-size: .78rem; padding: 2px 0; color: var(--muted); font-style: italic; }
  .combos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: .65rem; margin-top: .75rem; }
  .combo-card     { background: var(--surf); border: 1px solid var(--bord); border-radius: 8px; padding: .7rem; }
  .combo-card.nem { border-color: #7f1d1d; }
  .combo-card.royal { border-color: #4c1d95; }
  .combo-cards { display: flex; gap: 3px; flex-wrap: wrap; margin: .3rem 0; }
  .combo-ctag  { background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-size: .7rem; font-family: sans-serif; color: var(--text); }
  .scores-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .row    { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row-sb { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
  .muted  { color: var(--muted); font-family: sans-serif; font-size: .85rem; }
  .gold   { color: var(--gold); }
  .goldL  { color: var(--goldL); }
  .sans   { font-family: sans-serif; }
  .mb1    { margin-bottom: 1rem; }
  .mb05   { margin-bottom: .5rem; }
  .lbl    { display: block; color: var(--muted); font-family: sans-serif; font-size: .8rem; margin-bottom: .4rem; }
  .room-code { font-size: 2.2rem; letter-spacing: .25em; font-family: monospace; color: var(--goldL);
               background: var(--card); border: 1px solid var(--gold); border-radius: 8px; padding: .4rem 1.2rem; display:inline-block; }
  .error  { color: var(--red); font-family: sans-serif; font-size: .85rem; margin-top: .5rem; }
  .win-box { background: #1a0a00; border: 1px solid var(--gold); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; text-align: center; }
  .win-title { font-size: 1.3rem; color: var(--goldL); margin-bottom: .4rem; }
  .tog-btn { background: transparent; color: var(--muted); border: 1px solid var(--bord); border-radius: 6px; padding: .45rem 1rem; font-size: .82rem; font-family: sans-serif; width:100%; margin-top:.5rem; }
  .size-btn { min-width: 46px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media(max-width:500px){ .two-col { grid-template-columns: 1fr; } }
  .hidden { display: none !important; }
  /* abandon-partie modal */
  .modal-bg { position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100; }
  .modal    { background:var(--surf);border:1px solid var(--gold);border-radius:12px;padding:1.75rem;max-width:380px;width:90%;text-align:center; }
  .modal h3 { color:var(--goldL);margin-bottom:.75rem; }
  .modal p  { color:var(--muted);font-family:sans-serif;font-size:.88rem;margin-bottom:1.25rem; }
  .modal .row { justify-content:center;gap:.75rem; }
  /* burned cards zone */
  .burned-zone { display:flex;gap:5px;flex-wrap:wrap;align-items:center; }
</style>
</head>

<header>
  <div class="row-sb" style="max-width:900px;margin:0 auto;align-items:flex-start">
    <div style="flex:1"></div>
    <div style="flex:2;text-align:center">
      <h1>⚜ Le Jeu des Couronnes</h1>
      <p>Jeu créé et imaginé par JLK.</p>
    </div>
    <div style="flex:1;display:flex;justify-content:flex-end;padding-top:.3rem">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQK8FPpb_QHYZzr7NrWgKYict7Gv7pd8k",
  authDomain: "jeu-couronnes.firebaseapp.com",
  databaseURL: "https://jeu-couronnes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jeu-couronnes",
  storageBucket: "jeu-couronnes.firebasestorage.app",
  messagingSenderId: "722966971918",
  appId: "1:722966971918:web:efe1a55aa1adfe9b3c9e5f"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);
async function dbGet(roomId)       { const s=await get(ref(db,`rooms/${roomId}`)); return s.exists()?s.val():null; }
async function dbSet(roomId,data)  { await set(ref(db,`rooms/${roomId}`),data); }
function dbListen(roomId,cb)       { const r=ref(db,`rooms/${roomId}`); onValue(r,s=>cb(s.exists()?s.val():null)); return ()=>off(r); }
async function dbListPublicRooms() {
  try {
    const s = await get(ref(db,"rooms"));
    if(!s.exists()) return [];
    const all = Object.values(s.val()||{});
    return all.filter(r=>r && r.isPublic && (r.status==="lobby"||r.status==="playing"))
              .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  } catch { return []; }
}

// ═══════════════════════════════════════════════
// DONNÉES DU JEU
// ═══════════════════════════════════════════════
const CARDS = [
  {id:7,name:"Le Souverain d'Ébène", symbol:"👑", value:7},
  {id:6,name:"La Dame d'Ivoire",      symbol:"👗", value:6},
  {id:5,name:"Le Chevalier d'Acier",  symbol:"⚔️", value:5},
  {id:4,name:"L'Alchimiste d'Or",     symbol:"🧪", value:4},
  {id:3,name:"Le Prophète Voilé",     symbol:"🔮", value:3},
  {id:2,name:"Le Masque de Velours",  symbol:"🎭", value:2},
  {id:1,name:"Le Fou Écarlate",       symbol:"🕺", value:1},
];

// Pour 3-4 joueurs : double deck (2 exemplaires de chaque carte)
function buildDeck(numPlayers) {
  if(numPlayers<=2) return [...CARDS];
  return [...CARDS,...CARDS.map(c=>({...c,uid:c.id+100}))]; // uid unique pour l'affichage
}

const COMBINATIONS = [
  // Royales (1-3)
  {id:1,  name:"Le Couronnement d'Ébène", type:"royal",   cards:[4,6,7], rank:1,  quote:"La science, la noblesse et le pouvoir s'unissent pour fonder un royaume éternel."},
  {id:2,  name:"Le Pacte de la Couronne",  type:"royal",   cards:[2,6,7], rank:2,  quote:"Même les intrigues servent la Couronne lorsque le royaume est en péril."},
  {id:3,  name:"L'Oracle du Trône",        type:"royal",   cards:[2,3,7], rank:3,  quote:"Le souverain règne autant par les prophéties que par la force."},
  // Classiques (4-11)
  {id:4,  name:"Le Savoir Ultime",         type:"classic", cards:[3,5,6], rank:4,  quote:"Le savoir ultime est toujours proche de la folie."},
  {id:5,  name:"Le Cercle des Conseillers",type:"classic", cards:[2,4,5], rank:5,  quote:"Le royaume prospère lorsque la force, le savoir et la ruse s'accordent."},
  {id:6,  name:"Le Destin Voilé",          type:"classic", cards:[1,3,7], rank:6,  quote:"Le destin des rois naît souvent des actes des insensés."},
  {id:7,  name:"Les Arcanes d'Or",         type:"classic", cards:[3,4,6], rank:7,  quote:"La connaissance éclaire le royaume, mais exige toujours un prix."},
  {id:8,  name:"Le Grand Œuvre",           type:"classic", cards:[1,5,6], rank:8,  quote:"Le sacrifice transforme le chaos en grandeur."},
  {id:9,  name:"L'Héritage d'Ivoire",      type:"classic", cards:[4,5,7], rank:9,  quote:"Le royaume se construit par l'alliance de la force, du savoir et du pouvoir."},
  {id:10, name:"Le Conseil des Arcanes",   type:"classic", cards:[2,3,5], rank:10, quote:"Les vérités les plus dangereuses naissent dans les conseils les plus secrets."},
  {id:11, name:"La Garde du Royaume",      type:"classic", cards:[1,3,4], rank:11, quote:"Le royaume ne survit que lorsque la sagesse maîtrise le chaos."},
  // Némésis (12-14) — annulent toutes les royales
  {id:12, name:"L'Alliance Écarlate",      type:"nemesis", cards:[1,5,7], rank:12, quote:"Le pouvoir succombe lorsque la guerre marche aux côtés de la folie.",       effect:"Annule toutes les combinaisons Royales."},
  {id:13, name:"Le Pacte des Damnés",      type:"nemesis", cards:[1,2,6], rank:13, quote:"Les masques tombent et la Couronne se condamne elle-même.",                  effect:"Annule toutes les combinaisons Royales."},
  {id:14, name:"L'Éclipse du Royaume",     type:"nemesis", cards:[1,2,4], rank:14, quote:"Lorsque la folie, la tromperie et les arcanes s'unissent, aucun royaume ne peut survivre.", effect:"Annule toutes les combinaisons Royales."},
];

function findCombo(cardIds) {
  const s=[...cardIds].sort((a,b)=>a-b);
  return COMBINATIONS.find(c=>[...c.cards].sort((a,b)=>a-b).every((v,i)=>v===s[i]))||null;
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// Résolution : royal > classic > nemesis > valeur numérique
// Les némésis annulent UNIQUEMENT les royales
function resolveManche(players) {
  const results = players.map(p=>({...p, combo:findCombo(p.hand.map(c=>c.id))}));
  let active = results.map(r=>({...r,eliminated:false}));
  // Étape 2 : némésis → annule les royales
  if(active.some(p=>p.combo?.type==="nemesis"))
    active=active.map(p=>({...p,eliminated:p.combo?.type==="royal"}));
  const cont=active.filter(p=>!p.eliminated);
  const royal  =cont.filter(p=>p.combo?.type==="royal");
  const classic=cont.filter(p=>p.combo?.type==="classic");
  const nem    =cont.filter(p=>p.combo?.type==="nemesis");
  // Royale restante > classique > némésis
  const allCombos=[...royal,...classic,...nem];
  if(allCombos.length>0){
    // Tri : royal rank 1-3 < classic rank 4-11 < nemesis rank 12-14
    const best=allCombos.reduce((b,c)=>c.combo.rank<b.combo.rank?c:b);
    // Égalité exacte possible
    const tied=allCombos.filter(p=>p.combo.rank===best.combo.rank);
    if(tied.length>1) return {winner:null,draw:tied,reason:`Égalité entre ${tied.map(p=>p.name).join(" & ")} avec « ${best.combo.name} » ! Le pot est partagé.`,results:active};
    return {winner:best,draw:null,reason:`${best.name} remporte la manche avec « ${best.combo.name} »`,results:active};
  }
  // Pas de combinaison : valeur numérique
  const ranked=cont.map(p=>({...p,total:p.hand.reduce((s,c)=>s+c.value,0)}));
  const maxV=Math.max(...ranked.map(p=>p.total));
  const tied=ranked.filter(p=>p.total===maxV);
  if(tied.length>1) return {winner:null,draw:tied,reason:`Égalité ! Le pot est partagé. (${maxV} pts chacun)`,results:active};
  const w=ranked.reduce((b,c)=>c.total>b.total?c:b);
  return {winner:w,draw:null,reason:`${w.name} remporte la manche par valeur numérique (${w.total} pts)`,results:active};
}

// SESSION
// ═══════════════════════════════════════════════
function saveSession(s) { localStorage.setItem("jdc_session",JSON.stringify(s)); }
function loadSession()  { try{return JSON.parse(localStorage.getItem("jdc_session"));}catch{return null;} }
function clearSession() { localStorage.removeItem("jdc_session"); }

// ═══════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════
const app=document.getElementById("app");
function render(html){app.innerHTML=html;}
function $(id){return document.getElementById(id);}
function on(id,ev,fn){const el=$(id);if(el)el.addEventListener(ev,fn);}

function cardVis(card,hidden=false,sm=false,glow=false,burned=false){
  const cls=`crd ${sm?"sm":"lg"} ${hidden?"hidden":""} ${glow?"glow":""} ${burned?"burned":""}`;
  if(hidden) return `<div class="${cls}"><span class="hidden-sym">✦</span></div>`;
  return `<div class="${cls}">
    <span class="sym" style="font-size:${sm?"1.6rem":"2.2rem"}">${card.symbol}</span>
    <span class="cname" style="font-size:${sm?".42rem":".58rem"};margin-top:2px">${card.name}</span>
  </div>`;
}
function emptySlot(sm=false){
  return `<div class="crd-empty ${sm?"sm":""}"><span style="color:var(--bord);font-size:.7rem">?</span></div>`;
}
function pillCombo(combo,eliminated=false){
  if(!combo) return "";
  if(eliminated) return `<span class="pill-elim">❌ ${combo.name}</span>`;
  const cls=combo.type==="nemesis"?"pill-nem":combo.type==="royal"?"pill-royal":"pill-classic";
  return `<span class="${cls}">${combo.name}</span>`;
}
function pillType(type){
  if(type==="nemesis") return `<span class="pill-nem">Némésis</span>`;
  if(type==="royal")   return `<span class="pill-royal">Royale</span>`;
  return `<span class="pill-classic">Classique</span>`;
}

// ═══════════════════════════════════════════════
// COMBINAISONS REF
// ═══════════════════════════════════════════════
function renderCombosRef(myCardIds=[], opts={}){
  const {onlyPossible=false, threeCol=false} = opts;
  function isPossible(combo) {
    if(myCardIds.length===0) return true;
    const comboIds=combo.cards.map(Number);
    return myCardIds.every(id => comboIds.includes(Number(id)));
  }
  const gridClass = threeCol ? "combos-grid-3" : "combos-grid";
  const groups=[
    {label:"👑 Royales",   types:["royal"]},
    {label:"⚜️ Classiques",types:["classic"]},
    {label:"☠️ Némésis",   types:["nemesis"]},
  ];
  const html = groups.map(g=>{
    let combos=COMBINATIONS.filter(c=>g.types.includes(c.type));
    if(onlyPossible) combos=combos.filter(isPossible);
    if(combos.length===0) return "";
    return `
      <div style="margin-bottom:1rem">
        <div style="font-family:sans-serif;font-size:.8rem;color:var(--muted);margin-bottom:.5rem;font-weight:700">${g.label}</div>
        <div class="${gridClass}">
          ${combos.map(c=>{
            const possible=isPossible(c);
            const cardStyle=possible
              ? ""
              : "opacity:0.35;filter:grayscale(1);border:2px solid #dc2626;background:#1a0505;";
            return `
            <div class="combo-card ${c.type}" style="${cardStyle}transition:opacity .3s,filter .3s,border-color .3s,background .3s">
              <div class="row mb05">
                <span class="${possible?"goldL":"muted"}" style="font-size:.85rem">${c.name}</span>
                ${threeCol?"":pillType(c.type)}
              </div>
              <div class="combo-cards">${c.cards.map(cid=>{
                const card=CARDS.find(x=>x.id===cid);
                const inHand=myCardIds.includes(cid);
                return `<span class="combo-ctag" style="font-size:1.1rem;padding:3px 7px;${inHand?"background:#2a4a2a;border:1px solid #22c55e;color:#86efac":""}">${card.symbol}</span>`;
              }).join("")}</div>
              ${c.effect?`<div style="color:#f87171;font-size:.68rem;font-family:sans-serif;margin-top:.25rem">⚡ ${c.effect}</div>`:""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
  }).join("");
  if(onlyPossible && !html.trim()){
    return `<p class="muted" style="font-family:sans-serif;font-size:.85rem;text-align:center;padding:1rem 0">Aucune combinaison possible avec ta main actuelle.</p>`;
  }
  return html;
}

// DÉMARRAGE D'UNE MANCHE (réutilisé pour manche 1 et suivantes)
// ═══════════════════════════════════════════════
function buildRoundState(rs, roundNumber, bigBlindIdx) {
  const numP=rs.players.length;
  const sb=Math.max(1,Math.floor(rs.budget*.02));
  const bb=sb*2;
  let pot=0;

  // Deck : simple (2j) ou double (3-4j)
  let allCards=shuffle(buildDeck(numP).map(c=>({...c})));

  // Distribution : 1 carte cachée par joueur
  const dealt=allCards.splice(0,numP);
  let deck=[...allCards];
  let burnedCards=[];

  const players=rs.players.map((p,i)=>{
    const pay=i===bigBlindIdx?bb:sb;
    pot+=Math.min(pay,p.coins);
    return {...p,coins:Math.max(0,p.coins-pay),hand:[dealt[i]]};
  });

  // À 3 joueurs : brûler 1 carte face visible dès le départ
  if(numP===3){
    const burned=deck.shift();
    burnedCards.push(burned);
  }

  const firstCard=deck.shift();
  const log=[
    `── Manche ${roundNumber} — Grosse blinde : ${players[bigBlindIdx].name} (${bb} 🪙). Petites : ${sb} 🪙.`,
    `Pot : ${pot} 🪙.${numP===3?" (3 joueurs : 1 carte brûlée face visible)":""}`,
    `── Carte révélée : ${firstCard.name} (${firstCard.symbol}) — Priorité : ${players[bigBlindIdx].name}`,
  ];

  return {
    ...rs,
    status:"playing",
    round:roundNumber,
    players,pot,deck,burnedCards,
    auctionCard:firstCard,
    auctionPhase:1,
    auctionPriority:bigBlindIdx,
    currentBid:0,currentBidder:bigBlindIdx,lastBidder:-1,
    mancheOver:false,winner:null,winReason:"",drawPlayers:null,roundResults:null,
    auctionLog:log,
    allScores:roundNumber===1?rs.players.map(p=>({id:p.id,name:p.name,total:0})):rs.allScores,
    abandonVotes:[],
  };
}

async function doStartGame(roomId){
  const rs=await dbGet(roomId);
  if(!rs||rs.players.length<2) return;
  await dbSet(roomId,buildRoundState(rs,1,0));
}

function renderGame(sess,rs){
  const {roomId,playerId}=sess;
  const myIdx=rs.players.findIndex(p=>p.id===playerId);
  const me=rs.players[myIdx];
  const isMyTurn=rs.currentBidder===myIdx&&!rs.mancheOver&&rs.auctionCard;
  const isFirstBid=rs.lastBidder===-1;
  const numP=rs.players.length;

  // Header : pot + score à côté, en haut à droite
  const hdr=$("game-header");
  if(hdr){
    const myScore=(rs.allScores||[]).find(s=>s.id===playerId);
    const scoresHtml=(rs.allScores||[]).map(s=>`<span style="margin-right:.6rem"><span class="muted">${s.name}:</span> <strong class="goldL">${s.total}</strong></span>`).join("");
    hdr.innerHTML=`
      <span class="sans gold" style="font-size:.85rem">Manche ${rs.round} · <span style="letter-spacing:.1em">${roomId}</span></span>
      <div class="row" style="gap:.6rem">
        <span class="box sans" style="padding:.35rem .9rem;font-size:.85rem;margin:0">${scoresHtml||"<span class='muted'>Scores : 0 partout</span>"}</span>
        <span class="box" style="padding:.35rem .9rem;font-family:sans-serif;font-size:.9rem;margin:0">Pot : <strong class="goldL">${rs.pot} 🪙</strong></span>
        <button class="btn-warn" id="btn-abandon-req" style="font-size:.78rem;padding:.35rem .8rem">⚑ Abandon</button>
      </div>`;
  }
  on("btn-abandon-req","click",()=>showAbandonModal(sess,rs));

  // Cartes brûlées (3 joueurs)
  const ba=$("burned-area");
  if(ba){
    if(rs.burnedCards&&rs.burnedCards.length>0){
      ba.innerHTML=`
        <div class="box" style="padding:.65rem 1rem;margin-bottom:.65rem">
          <div class="muted" style="font-size:.75rem;margin-bottom:.4rem">🔥 Cartes hors jeu (croupier)</div>
          <div class="burned-zone">${rs.burnedCards.map(c=>cardVis(c,false,true,false,true)).join("")}</div>
        </div>`;
    } else ba.innerHTML="";
  }

  // Players
  const pg=$("players-grid");
  if(pg){
    pg.style.gridTemplateColumns = numP>=3 ? "1fr 1fr" : "1fr";
    pg.innerHTML=rs.players.map((p,i)=>{
    const isActive=!rs.mancheOver&&rs.currentBidder===i&&rs.auctionCard;
    const isMe=p.id===playerId;
    const isFull=p.hand.length>=3;
    const bc=isActive?"var(--gold)":isMe?"#4c1d9588":"var(--bord)";
    const handHtml=p.hand.map(card=>cardVis(card,!rs.mancheOver&&!isMe,true)).join("")
      +Array.from({length:Math.max(0,3-p.hand.length)}).map(()=>emptySlot(true)).join("");
    let comboHtml="";
    if(rs.mancheOver&&rs.roundResults){
      const res=rs.roundResults.find(r=>r.id===p.id);
      if(res) comboHtml=res.combo
        ?`<div style="margin-top:.35rem">${pillCombo(res.combo,res.eliminated)}</div>`
        :`<div class="muted" style="margin-top:.35rem;font-size:.7rem">${p.hand.reduce((s,c)=>s+c.value,0)} pts</div>`;
    }
    return `<div class="player-box ${isMe?"mine":""} ${isActive?"active":""}" style="border-color:${bc}">
      <div class="row-sb">
        <span style="font-weight:600;font-size:.9rem;color:${isMe?"var(--goldL)":"var(--text)"}">${p.name}${isMe?" (toi)":""}</span>
        <span class="sans gold" style="font-size:.8rem">${p.coins}🪙</span>
      </div>
      <div class="player-hand">${handHtml}</div>
      ${comboHtml}
      ${isActive&&!rs.mancheOver?`<div style="margin-top:.3rem"><span class="tag-active">● Son tour</span></div>`:""}
      ${isFull&&!rs.mancheOver?`<div style="margin-top:.3rem"><span class="tag-out">✓ Main complète</span></div>`:""}
    </div>`;
    }).join("");
  }

  // Auction area
  const aa=$("auction-area");
  if(aa){
    if(!rs.mancheOver){
      if(rs.auctionCard){
        const bidSection=isMyTurn?`
          <div class="gold sans" style="font-weight:600;margin-bottom:.65rem">C'est ton tour, ${me?.name} (${me?.coins} 🪙 disponibles)</div>
          <div class="row">
            ${isFirstBid
              ?`<button class="btn-secondary" id="btn-pass">Passer</button>
                <input type="number" id="bid-inp" min="1" placeholder="Mise…" style="width:100px"/>
                <button class="btn-primary" id="btn-open">Ouvrir</button>`
              :`<button class="btn-danger" id="btn-fold">Abandonner</button>
                <input type="number" id="bid-inp" min="${rs.currentBid+1}" placeholder="> ${rs.currentBid}" style="width:100px"/>
                <button class="btn-primary" id="btn-raise">Surenchérir</button>`}
          </div>`
          :`<p class="muted">En attente de <strong style="color:var(--text)">${rs.players[rs.currentBidder]?.name}</strong>…</p>`;
        aa.innerHTML=`
          <div class="box ${isMyTurn?"accent":""}">
            <div class="row mb1">
              ${cardVis(rs.auctionCard,false,false,isMyTurn)}
              <div>
                <div style="font-size:1.05rem;font-weight:600;margin-bottom:.25rem">${rs.auctionCard.name}</div>
                <div class="muted">Valeur : ${rs.auctionCard.value}</div>
                ${rs.currentBid>0?`<div class="gold sans" style="font-size:.82rem;margin-top:.2rem">Enchère : ${rs.currentBid} 🪙 par ${rs.players[rs.lastBidder]?.name}</div>`:""}
              </div>
            </div>
            ${bidSection}
          </div>`;
        if(isMyTurn){
          if(isFirstBid){
            on("btn-pass","click",()=>mutateGame(sess.roomId,doPass));
            on("btn-open","click",()=>{const a=parseInt($("bid-inp")?.value);if(!isNaN(a)&&a>0)mutateGame(sess.roomId,s=>doBid(s,a));});
          }else{
            on("btn-fold","click",()=>mutateGame(sess.roomId,doFold));
            on("btn-raise","click",()=>{const a=parseInt($("bid-inp")?.value);if(!isNaN(a)&&a>rs.currentBid)mutateGame(sess.roomId,s=>doBid(s,a));});
          }
        }
      }else{
        aa.innerHTML=`<div class="box"><p class="muted" style="text-align:center">Préparation…</p></div>`;
      }
    }else aa.innerHTML="";
  }

  // Manche over
  const moa=$("manche-over-area");
  if(moa){
    if(rs.mancheOver&&rs.status!=="gameover"){
      const isWinner=rs.winner?.id===playerId;
      const isHost=rs.players[0]?.id===playerId;
      moa.innerHTML=`
        <div class="win-box">
          <div class="win-title">${rs.drawPlayers?"⚔️ Égalité !":isWinner?"🏆 Tu remportes la manche !":rs.winner?`🏆 ${rs.winner.name} remporte la manche !`:""}</div>
          <div class="muted mb1">${rs.winReason}</div>
          ${isHost
            ?`<button class="btn-primary" id="btn-next">Manche suivante →</button>`
            :`<p class="muted">En attente que l'hôte lance la manche suivante…</p>`}
        </div>`;
      if(isHost) on("btn-next","click",()=>mutateGame(sess.roomId,doNextRound));
    }else moa.innerHTML="";
  }

  // Log
  const logEl=$("log");
  if(logEl){
    logEl.innerHTML=(rs.auctionLog||[]).map(line=>{
      const cls=line.startsWith("──")?"log-sep":line.startsWith("🔥")?"log-burn":"log-line";
      return `<div class="${cls}">${line}</div>`;
    }).join("");
    logEl.scrollTop=logEl.scrollHeight;
  }

  // Mise à jour aide-mémoire (toujours visible dans colonne 2, uniquement possibles, 3/ligne)
  const cr3=$("combos-ref3");
  if(cr3){
    const myHand=me?.hand||[];
    const myCardIds=myHand.map(c=>Number(c.id));
    cr3.innerHTML=renderCombosRef(myCardIds,{onlyPossible:true,threeCol:true});
  }

  // Vote d'abandon : pop-up par-dessus tout le jeu, visible par tous (y compris l'initiateur)
  const modal=$("modal-area");
  if(modal){
    if(rs.abandonVotes&&rs.abandonVotes.length>0){
      const votes=rs.abandonVotes||[];
      const needed=rs.players.length;
      const iVoted=votes.includes(playerId);
      const isHost=rs.players[0]?.id===playerId;
      modal.innerHTML=`
        <div class="modal-bg">
          <div class="modal">
            <h3>⚑ Vote d'abandon en cours</h3>
            <p>${votes.length}/${needed} joueur(s) ont voté pour abandonner la partie et repartir au lobby.<br>Il faut l'unanimité — ou un joueur peut forcer l'abandon immédiatement.</p>
            <div class="row" style="flex-direction:column;align-items:stretch">
              ${!iVoted
                ?`<button class="btn-warn" id="btn-vote-yes">Voter pour abandonner</button>`
                :`<p class="muted" style="margin-bottom:0">Tu as voté. En attente des autres…</p>`}
              <button class="btn-danger" id="btn-force-abandon">Abandonner sans attendre les votes</button>
            </div>
          </div>
        </div>`;
      if(!iVoted) on("btn-vote-yes","click",()=>mutateGame(sess.roomId,s=>voteAbandon(s,playerId)));
      on("btn-force-abandon","click",()=>mutateGame(sess.roomId,s=>forceAbandon(s)));
    } else {
      modal.innerHTML="";
    }
  }
}

// ═══════════════════════════════════════════════
// ABANDON MODAL
// ═══════════════════════════════════════════════
function showAbandonModal(sess,rs){
  // Lance directement le vote — le pop-up de vote (toujours visible par tous) prend le relais
  mutateGame(sess.roomId,s=>voteAbandon(s,sess.playerId));
}

function voteAbandon(s,playerId){
  const votes=[...new Set([...(s.abandonVotes||[]),playerId])];
  if(votes.length>=s.players.length){
    return resetToLobby(s);
  }
  return {...s,abandonVotes:votes};
}

function forceAbandon(s){
  return resetToLobby(s);
}

function resetToLobby(s){
  return {
    ...s,
    status:"lobby",
    players:s.players.map(p=>({...p,hand:[],coins:s.budget})),
    abandonVotes:[],
    deck:[],pot:0,auctionCard:null,auctionPhase:0,
    mancheOver:false,winner:null,winReason:"",drawPlayers:null,roundResults:null,
    auctionLog:[],allScores:[],burnedCards:[],round:1,
  };
}

// ═══════════════════════════════════════════════
// MUTATIONS DE JEU
// ═══════════════════════════════════════════════
async function mutateGame(roomId,fn){
  if(gameActing) return;
  gameActing=true;
  try{
    const fresh=await dbGet(roomId);
    if(!fresh){gameActing=false;return;}
    const next=fn(fresh);
    await dbSet(roomId,next);
  }finally{gameActing=false;}
}

function nextEligible(players,fromIdx,excludeIdx=-1){
  const n=players.length;
  for(let step=1;step<n;step++){
    const i=(fromIdx+step)%n;
    if(i!==excludeIdx&&players[i].hand.length<3) return i;
  }
  return -1;
}
function countEligible(players){return players.filter(p=>p.hand.length<3).length;}

// Vérifie si à 3 joueurs il faut brûler une carte intermédiaire
// (quand chacun vient d'obtenir sa 2e carte, avant la 3e)
function checkMidBurn(s,newPlayers){
  if(s.players.length!==3) return {players:newPlayers,deck:s.deck,burnedCards:s.burnedCards||[],log:[]};
  const prevTwoCount=s.players.filter(p=>p.hand.length>=2).length;
  const newTwoCount=newPlayers.filter(p=>p.hand.length>=2).length;
  // Brûler quand tous les joueurs ont exactement 2 cartes pour la première fois
  const allHadTwo = prevTwoCount < 3 && newTwoCount === 3;
  if(allHadTwo && s.deck.length>0){
    const deck=[...s.deck];
    const burned=deck.shift();
    return {
      players:newPlayers,deck,
      burnedCards:[...(s.burnedCards||[]),burned],
      log:[`🔥 Croupier brûle une carte : ${burned.name} (${burned.symbol})`]
    };
  }
  return {players:newPlayers,deck:s.deck,burnedCards:s.burnedCards||[],log:[]};
}

function afterCard(s,newPlayers,newPot,log){
  // Vérifier brûlure intermédiaire (3 joueurs, après que chacun a 2 cartes)
  const burn=checkMidBurn(s,newPlayers);
  newPlayers=burn.players;
  const deck=burn.deck;
  const burnedCards=burn.burnedCards;
  log=[...log,...burn.log];

  if(countEligible(newPlayers)===0){
    const result=resolveManche(newPlayers);
    let fp=newPlayers,fp2=newPot;
    if(result.draw){
      const share=Math.floor(newPot/result.draw.length);
      fp=newPlayers.map(p=>result.draw.find(d=>d.id===p.id)?{...p,coins:p.coins+share}:p);
      fp2=0;
    }else if(result.winner){
      fp=newPlayers.map(p=>p.id===result.winner.id?{...p,coins:p.coins+newPot}:p);
      fp2=0;
    }
    const allScores=(s.allScores||[]).map(sc=>result.winner&&sc.id===result.winner.id?{...sc,total:sc.total+1}:sc);
    const bust=fp.some(p=>p.coins<=0);
    const targetReached=(s.targetRounds||10)>0&&allScores.some(sc=>sc.total>=(s.targetRounds||10));
    return {...s,players:fp,pot:fp2,deck,burnedCards,auctionCard:null,
      mancheOver:true,winner:result.winner||null,winReason:result.reason,
      drawPlayers:result.draw||null,roundResults:result.results,allScores,
      auctionLog:[...log,"── Fin de manche ──",result.reason],
      status:(bust||targetReached)?"gameover":"playing",
      gameOverReason:bust?"bust":targetReached?"target":null};
  }

  if(deck.length===0){
    // Plus de cartes — résoudre quand même
    const result=resolveManche(newPlayers);
    const allScores=(s.allScores||[]).map(sc=>result.winner&&sc.id===result.winner.id?{...sc,total:sc.total+1}:sc);
    const bust=newPlayers.some(p=>p.coins<=0);
    const targetReached=(s.targetRounds||10)>0&&allScores.some(sc=>sc.total>=(s.targetRounds||10));
    return {...s,players:newPlayers,pot:newPot,deck,burnedCards,auctionCard:null,
      mancheOver:true,winner:result.winner||null,winReason:result.reason,
      drawPlayers:result.draw||null,roundResults:result.results,allScores,
      auctionLog:[...log,"── Fin de manche ──",result.reason],
      status:(bust||targetReached)?"gameover":"playing",
      gameOverReason:bust?"bust":targetReached?"target":null};
  }

  const newPhase=s.auctionPhase+1;
  let priorityIdx=-1;
  const numP=newPlayers.length;
  for(let step=0;step<numP;step++){
    const i=(s.auctionPriority+newPhase-1+step)%numP;
    if(newPlayers[i].hand.length<3){priorityIdx=i;break;}
  }

  if(countEligible(newPlayers)===1){
    let np=[...newPlayers];let dk=[...deck];let lg=[...log];
    const card=dk.shift();
    np=np.map((p,i)=>i===priorityIdx?{...p,hand:[...p.hand,card]}:p);
    lg.push(`${np[priorityIdx].name} est seul encore en lice — récupère la carte gratuitement.`);
    while(dk.length>0&&np[priorityIdx].hand.length<3){
      const c=dk.shift();
      np=np.map((p,i)=>i===priorityIdx?{...p,hand:[...p.hand,c]}:p);
      lg.push(`${np[priorityIdx].name} récupère ${c.name} (${c.symbol}) gratuitement.`);
    }
    return afterCard({...s,deck:dk,burnedCards,auctionPhase:newPhase},np,newPot,lg);
  }

  const card=deck[0];const deckNext=deck.slice(1);
  return {...s,players:newPlayers,pot:newPot,deck:deckNext,burnedCards,
    auctionCard:card,auctionPhase:newPhase,
    currentBid:0,currentBidder:priorityIdx,lastBidder:-1,
    auctionLog:[...log,`── Carte révélée : ${card.name} (${card.symbol}) — Priorité : ${newPlayers[priorityIdx].name}`]};
}

function doPass(s){
  const {players,auctionCard,currentBidder}=s;
  const oi=nextEligible(players,currentBidder,currentBidder);
  if(oi===-1) return s;
  const np=players.map((p,i)=>i===oi?{...p,hand:[...p.hand,auctionCard]}:p);
  return afterCard(s,np,s.pot,[...s.auctionLog,`${players[currentBidder].name} passe → ${players[oi].name} récupère la carte gratuitement.`]);
}
function doBid(s,amount){
  const {players,currentBidder,currentBid}=s;
  if(isNaN(amount)||amount<=currentBid) return s;
  const nextIdx=nextEligible(players,currentBidder);
  if(nextIdx===-1) return s;
  return {...s,currentBid:amount,lastBidder:currentBidder,currentBidder:nextIdx,
    auctionLog:[...s.auctionLog,`${players[currentBidder].name} propose ${amount} 🪙`]};
}
function doFold(s){
  const {players,auctionCard,lastBidder,currentBid,currentBidder}=s;
  const np=players.map((p,i)=>i===lastBidder?{...p,hand:[...p.hand,auctionCard],coins:p.coins-currentBid}:p);
  return afterCard(s,np,s.pot+currentBid,[...s.auctionLog,`${players[currentBidder].name} abandonne. ${players[lastBidder].name} remporte la carte pour ${currentBid} 🪙.`]);
}
function doNextRound(s){
  const numP=s.players.length;
  const bigBlindIdx=(s.auctionPriority+1)%numP;
  return buildRoundState({...s,players:s.players.map(p=>({...p,hand:[]}))},s.round+1,bigBlindIdx);
}

// ═══════════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════════
function screenGameOver(sess,rs){
  app.classList.remove("in-game");
  const sorted=[...(rs.allScores||[])].sort((a,b)=>b.total-a.total);
  const richest=[...rs.players].sort((a,b)=>b.coins-a.coins);
  const champion=sorted[0];
  const reasonText = rs.gameOverReason==="target"
    ? `${champion?.name||""} atteint l'objectif de ${rs.targetRounds||10} manches gagnées !`
    : "Un joueur ne peut plus payer ses blindes.";
  render(`
    <div style="background:#1a0a00;border:1px solid var(--gold);border-radius:12px;padding:2rem;text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem;margin-bottom:.5rem">👑</div>
      <h2 class="goldL" style="margin-bottom:.4rem">Fin de partie</h2>
      <p class="muted">${reasonText}</p>
    </div>
    <div class="two-col mb1">
      <div class="box">
        <h3 class="gold sans" style="font-size:.95rem;margin-bottom:.75rem">Manches gagnées</h3>
        ${sorted.map((sc,i)=>`<div class="row-sb" style="padding:3px 0;font-family:sans-serif;font-size:.88rem">
          <span style="color:${i===0?"var(--goldL)":"var(--text)"}">${i===0?"🏆 ":""}${sc.name}</span>
          <strong class="goldL">${sc.total}</strong></div>`).join("")}
      </div>
      <div class="box">
        <h3 class="gold sans" style="font-size:.95rem;margin-bottom:.75rem">Pièces restantes</h3>
        ${richest.map((p,i)=>`<div class="row-sb" style="padding:3px 0;font-family:sans-serif;font-size:.88rem">
          <span style="color:${i===0?"var(--goldL)":"var(--text)"}">${i===0?"💰 ":""}${p.name}</span>
          <strong class="gold">${p.coins}🪙</strong></div>`).join("")}
      </div>
    </div>
    <div style="text-align:center">
      <button class="btn-primary" id="btn-restart">Nouvelle partie</button>
    </div>
  `);
  on("btn-restart","click",()=>{clearSession();screenLobby();});
}

// ═══════════════════════════════════════════════
// RÈGLES (pop-up)
// ═══════════════════════════════════════════════
function showRulesModal(){
  const ma=$("rules-modal-area");
  if(!ma) return;
  ma.innerHTML=`
    <div class="modal-bg" id="rules-overlay">
      <div class="modal" style="max-width:640px;text-align:left;max-height:85vh;overflow-y:auto">
        <h3 style="text-align:center">📜 Règles du jeu</h3>
        <div class="sans" style="font-size:.85rem;line-height:1.6;color:var(--text)">
          <p class="muted mb1">Le jeu comprend 7 cartes de figures, 14 combinaisons, et des pièces servant aux enchères. Chaque carte a une valeur numéraire propre. On gagne en réalisant une combinaison, ou en ayant la plus forte valeur numérique si aucune combinaison ne subsiste.</p>

          <h4 class="goldL mb05">👑 Combinaisons royales</h4>
          <p class="muted mb1">Les plus prestigieuses (3 combinaisons). Annulées par toute combinaison némésis présente.</p>

          <h4 class="goldL mb05">⚜️ Combinaisons classiques</h4>
          <p class="muted mb1">Combinaisons charnières (8 combinaisons). Ne sont jamais annulées par les némésis.</p>

          <h4 class="goldL mb05">☠️ Combinaisons némésis</h4>
          <p class="muted mb1">Moins puissantes mais leur présence annule toute combinaison royale en jeu. Une némésis ne s'annule jamais elle-même et reste active — elle peut remporter la manche si aucune royale ou classique ne subsiste.</p>

          <h4 class="goldL mb05">Mise en place (2 joueurs)</h4>
          <p class="muted mb1">Chaque joueur mise un montant égal. Au début de chaque manche, un joueur pose la petite blinde, l'autre la grosse blinde (qui a priorité sur la première enchère). Chaque joueur reçoit une carte cachée ; le reste forme la pioche.</p>

          <h4 class="goldL mb05">Phase d'enchères</h4>
          <p class="muted mb1">À chaque phase, une carte est révélée. Le joueur prioritaire ouvre l'enchère ou passe. S'il passe, l'autre récupère la carte gratuitement. S'il ouvre, les joueurs surenchérissent jusqu'à abandon — le dernier proposant remporte la carte et paie sa mise, qui rejoint le pot (l'argent engagé est définitivement perdu, même en cas d'abandon). La priorité alterne à chaque carte. La manche s'arrête lorsque chaque joueur a 3 cartes.</p>

          <h4 class="goldL mb05">Résolution</h4>
          <p class="muted mb1">Chaque joueur révèle ses 3 cartes. Les némésis annulent les royales présentes (qui sortent du classement). Puis : royale > classique > némésis > valeur numérique totale en cas d'égalité de combinaison ou d'absence de combinaison. En cas d'égalité parfaite, le pot est partagé.</p>

          <h4 class="goldL mb05">Variante 3-4 joueurs</h4>
          <p class="muted mb1">Le deck est doublé (14 cartes, 2 exemplaires de chaque). Un joueur est grosse blinde, tous les autres posent une petite blinde. À 3 joueurs, une carte est brûlée face visible au début (pour remplacer le 4e joueur absent), et une seconde dès que chacun a obtenu sa 2e carte. Quand un joueur atteint 3 cartes, il sort des enchères ; les autres continuent jusqu'à compléter leur main.</p>
        </div>
        <div class="row" style="justify-content:center;margin-top:1rem">
          <button class="btn-primary" id="btn-close-rules">Fermer</button>
        </div>
      </div>
    </div>`;
  on("btn-close-rules","click",()=>{const m=$("rules-modal-area");if(m)m.innerHTML="";});
}
on("btn-rules","click",showRulesModal);

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
async function boot(){
  const sess=loadSession();
  if(sess){
    const rs=await dbGet(sess.roomId);
    if(rs){
      if(rs.status==="lobby")   {screenWaiting(sess);return;}
      if(rs.status==="playing") {screenGame(sess,rs);return;}
      if(rs.status==="gameover"){screenGameOver(sess,rs);return;}
    }
    clearSession();
  }
  screenLobby();
}
boot();
</script>
